<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Smart Scoreboard</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.26);
      --accent: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --line: rgba(15, 23, 42, 0.14);
        --accent: #0369a1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, 100%);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      height: 42px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0;
    }
    h1 {
      margin: 22px 0 10px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }
    a {
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    a.primary {
      color: #001018;
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <span class="code">404</span>
    <h1>Page not found</h1>
    <p>The Smart Scoreboard web server could not find that page. Check the address, open the Web API docs, or visit the custom user page if it is enabled and configured.</p>
    <nav aria-label="Recovery links">
      <a class="primary" href="/">Web API Docs</a>
      <a href="/demo/scoreboard">Scoreboard Demo</a>
      <a href="/user">Custom User Page</a>
    </nav>
  </main>
</body>
</html>
