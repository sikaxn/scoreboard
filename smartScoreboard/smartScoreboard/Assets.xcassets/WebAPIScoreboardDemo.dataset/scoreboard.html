<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Scoreboard</title>
  <style>
    :root {
      color-scheme: dark; font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --home: #f76147; --guest: #38adf2; --base: #000; --panel: #ffffff0d; --clock-panel: #ffffff12;
      --border: #ffffff14; --muted: #ffffff6b; --badge: #ffffff14; --left: var(--home); --right: var(--guest); color: #fff;
    }
    * { box-sizing: border-box; }
    [hidden], .hidden { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--base); }
    body { display: grid; place-items: center; isolation: isolate; }
    body[data-theme="highContrast"] { --home: #f57a1f; --guest: #1fb8fa; --panel: #ffffff14; --border: #ffffff2e; --muted: #ffffffb3; }
    body[data-theme="night"] { --home: #ed636b; --guest: #61b3ff; --base: #03050a; --panel: #ffffff0f; --muted: #ffffff80; }
    body[data-theme="sunlight"] { --home: #f57d2e; --guest: #38a6f2; --base: #291c0d; --panel: #ffffff14; --border: #ffffff1c; --muted: #ffffffa3; }
    body[data-reversed="true"] { --left: var(--guest); --right: var(--home); }
    #displayBackground { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: var(--base); pointer-events: none; }
    #displayBackground::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 15% 50%, color-mix(in srgb, var(--left) 28%, transparent), transparent 65%), radial-gradient(ellipse at 85% 50%, color-mix(in srgb, var(--right) 28%, transparent), transparent 65%), linear-gradient(135deg, #05080d, #0a0a12, #000); }
    body[data-background="clear"] #displayBackground::before, body[data-background="clearUnderBoard"] #displayBackground::before { background: linear-gradient(90deg, var(--left) 50%, var(--right) 50%); }
    body[data-background="none"] #displayBackground::before, body[data-background="image"] #displayBackground::before, body[data-background="smartScoreboard"] #displayBackground::before { background: none; }
    #backgroundPhoto { width: 100%; height: 100%; object-fit: cover; transform: translate(var(--photo-x, 0), var(--photo-y, 0)) scale(var(--photo-scale, 1)); }
    body[data-background="smartScoreboard"] #displayBackground { background: center / cover url('/demo/scoreboard-background.jpg'); }
    .board { width: min(96vw, 166vh); height: min(94vh, 62vw); display: grid; grid-template-rows: minmax(0, 1fr); padding: clamp(12px, 2.4vw, 46px); gap: 16px; border-radius: 32px; background: linear-gradient(135deg, #05080d99, #0a0a1277, #0009); }
    body[data-background="clearUnderBoard"] .board, body[data-background="image"] .board, body[data-background="smartScoreboard"] .board, body[data-background="none"] .board { background: transparent; }
    body[data-background="clear"] .board { background: linear-gradient(135deg, #05080d, #0a0a12, #000); }
    body.blackout #displayBackground, body[data-background="none"] #displayBackground { background: #000; }
    body.blackout .status { display: none; }
    body.blackout #displayBackground::before, body.blackout #backgroundPhoto, body.blackout .board, body.background-only .board { visibility: hidden; }
    .topbar, .footer { display: none; }
    .status { position: fixed; left: 18px; bottom: 14px; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 99px; background: #200c0ce8; color: #ffb4b4; font-size: 12px; }
    .status.connected { display: none; }
    .dot { width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
    .match { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr) minmax(0, 1fr); gap: clamp(10px, 2vw, 36px); }
    .home { --accent: var(--home); }
    .guest { --accent: var(--guest); }
    .team, .center, .team-hero, .player-panel, .event-card { min-width: 0; min-height: 0; padding: clamp(12px, 1.8vw, 30px); border: 1px solid var(--border); border-radius: 28px; background: var(--panel); }
    .team { display: flex; flex-direction: column; align-items: stretch; gap: clamp(8px, 1.4vh, 18px); }
    .nameplate { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1vh, 14px); text-align: center; }
    .team-logo { width: clamp(36px, 7vh, 100px); height: clamp(36px, 7vh, 100px); object-fit: contain; border-radius: 10px; }
    .team-role { color: var(--muted); font-size: clamp(10px, 1.25vw, 20px); font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
    .name { max-width: 100%; font-size: clamp(18px, 2.6vw, 44px); font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
    .nameplate::after { content: ""; width: 62%; height: clamp(4px, .55vh, 8px); border-radius: 99px; background: var(--accent); }
    .score-box { flex: 1; min-height: 0; display: grid; place-items: center; color: var(--accent); }
    .score { width: 100%; text-align: center; font-size: clamp(52px, min(13vw, 21vh), 230px); font-weight: 900; line-height: 1; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .stats { display: flex; flex-direction: column; gap: 7px; }
    .stat, .period-wins, .prep-time, .penalty { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--badge); font-size: clamp(11px, 1.2vw, 20px); font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat .stat-title { color: var(--muted); font-size: .75em; text-transform: uppercase; letter-spacing: .06em; }
    .allowances { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: end; }
    .allowance { width: clamp(5px, .65vw, 10px); height: clamp(5px, .65vw, 10px); border-radius: 50%; background: var(--accent); }
    .allowance.used { opacity: .18; }
    .center { display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 2.4vh, 26px); background: var(--clock-panel); text-align: center; }
    .event-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: clamp(14px, 1.8vw, 30px); font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
    .event-brand img { width: clamp(36px, 6vh, 82px); height: clamp(36px, 6vh, 82px); object-fit: contain; }
    .period-box { order: 3; padding: 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--badge); font-size: clamp(14px, 2.1vw, 32px); font-weight: 900; }
    .clock-box { order: 2; min-width: 0; }
    .clock { font-size: clamp(28px, 6vw, 110px); line-height: 1.2; letter-spacing: -.055em; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .injury-time { display: inline-block; margin-top: 8px; padding: 6px 12px; background: #ffb647; border-radius: 99px; color: #181006; font-weight: 900; }
    .shot-box { order: 4; color: #ffba55; padding: 10px; font-size: clamp(24px, 4vw, 70px); font-weight: 900; font-variant-numeric: tabular-nums; }
    .possession-box { order: 5; color: var(--muted); font-size: clamp(11px, 1.2vw, 20px); font-weight: 800; }
    .dual-clocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; order: 2; }
    .dual-clock { min-width: 0; display: grid; gap: 8px; padding: 12px 6px; border: 1px solid var(--border); border-radius: 14px; background: var(--badge); }
    .dual-clock.active { border-color: var(--accent); color: var(--accent); }
    .dual-clock span { font-size: clamp(10px, .9vw, 16px); overflow-wrap: anywhere; font-weight: 800; }
    .dual-clock strong { font-size: clamp(20px, 2.6vw, 48px); font-variant-numeric: tabular-nums; }
    .event-view { min-height: 0; display: grid; }
    .event-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
    .event-logo { width: min(38vw, 40vh); height: min(38vw, 40vh); object-fit: contain; }
    .event-title { font-size: clamp(24px, 5vw, 90px); font-weight: 900; overflow-wrap: anywhere; }
    .event-subtitle { color: var(--muted); font-size: clamp(14px, 2vw, 30px); }
    .team-view, .player-view { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2vw, 32px); }
    .team-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
    .team-hero-logo { width: min(22vw, 26vh); height: min(22vw, 26vh); object-fit: contain; }
    .team-hero-name { font-size: clamp(22px, 3.5vw, 60px); font-weight: 900; overflow-wrap: anywhere; }
    .team-hero-score { color: var(--accent); font-size: clamp(56px, 9vw, 150px); font-weight: 900; }
    .player-panel { display: flex; flex-direction: column; gap: 14px; }
    .player-panel-title { font-size: clamp(18px, 2.5vw, 40px); font-weight: 900; color: var(--accent); overflow-wrap: anywhere; }
    .player-list { min-height: 0; overflow: auto; display: grid; align-content: start; gap: 5px; scrollbar-width: thin; }
    .player-row { min-width: 0; display: grid; grid-template-columns: 2.5em minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: .5em .7em; border-radius: 10px; background: #0003; font-size: clamp(12px, 1.4vw, 22px); font-weight: 700; }
    .player-number { color: var(--accent); font-weight: 900; font-variant-numeric: tabular-nums; }
    .player-name { overflow-wrap: anywhere; }
    .player-meta { color: var(--muted); white-space: nowrap; font-size: .8em; }
    .player-row.has-fouls .player-meta { color: var(--foul-color, #fb6262); }
    .player-card { width: .6em; height: 1em; border-radius: 2px; }
    .player-card.yellow { background: #facc15; }
    .player-card.red { background: #ff5252; }
    .empty-players { color: var(--muted); padding: 16px; text-align: center; }
    .lineup { min-height: 0; max-height: 25%; overflow: hidden; }
    .lineup .player-row { font-size: clamp(10px, 1.05vw, 17px); }
    .lineup .player-list { overflow: visible; }
    .lineup[data-overflow="scroll"] .player-list { animation: lineup-scroll var(--lineup-duration, 18s) linear infinite alternate; }
    .lineup[data-direction="continuousUp"] .player-list, .lineup[data-direction="continuousDown"] .player-list { animation: lineup-continuous var(--lineup-duration, 18s) linear infinite; }
    .lineup[data-direction="throughUp"] .player-list, .lineup[data-direction="throughDown"] .player-list { animation: lineup-through var(--lineup-duration, 18s) linear infinite; }
    .lineup[data-direction="continuousDown"] .player-list, .lineup[data-direction="throughDown"] .player-list { animation-direction: reverse; }
    .lineup[data-overflow="fit"] .player-list { animation: none; }
    @keyframes lineup-continuous { to { transform: translateY(var(--lineup-cycle, 0)); } }
    @keyframes lineup-through { from { transform: translateY(var(--lineup-viewport, 0)); } to { transform: translateY(var(--lineup-end, 0)); } }
    @keyframes lineup-scroll { 0%, 12% { transform: translateY(0); } 88%, 100% { transform: translateY(var(--lineup-travel, 0)); } }
    .lineup[data-overflow="scroll"]:not(.has-overflow) .player-list { animation: none; }
    .lineup[data-overflow="fit"] { max-height: none; }
    .lineup[data-overflow="fit"] .player-row { padding: .22em .5em; font-size: clamp(11px, var(--lineup-size, 1vw), 16px); }
    .lineup[data-overflow="fade"] .player-list { animation: lineup-fade var(--page-seconds, 5s) ease-in-out infinite; }
    @keyframes lineup-fade { 0%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .penalties { display: grid; gap: 5px; }
    .penalty { color: #ffba55; }
    .prep-time { color: var(--accent); }
    .timer-alert { color: #ff4545 !important; }
    #dateTime { position: fixed; right: 2vw; top: 2vh; z-index: 15; padding: 8px 16px; border-radius: 99px; background: #0008; font-weight: 900; font-size: clamp(12px, 1.5vw, 24px); font-variant-numeric: tabular-nums; }
    body[data-font="block"] .score, body[data-font="block"] .clock, body[data-font="block"] .dual-clock strong, body[data-font="block"] .chess-time, body[data-font="block"] .shot-box { font-family: Impact, "Arial Black", sans-serif; letter-spacing: .01em; }
    body[data-font="dotMatrix"] .number-text { background: radial-gradient(circle, currentColor 1px, transparent 1.8px); background-size: 4px 4px; background-clip: text; -webkit-text-fill-color: transparent; }
    .number { position: relative; display: block; }
    .number svg { display: block; width: 100%; height: 1em; overflow: visible; }
    .number-text { display: block; }
    .number-text.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    body[data-layout="arena"] .match { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; }
    body[data-layout="arena"] .team { grid-row: 1; }
    body[data-layout="arena"] .team.home { grid-column: 1; }
    body[data-layout="arena"] .team.guest { grid-column: 2; }
    body[data-layout="arena"][data-reversed="true"] .team.home { grid-column: 2; }
    body[data-layout="arena"][data-reversed="true"] .team.guest { grid-column: 1; }
    body[data-layout="arena"] .center { grid-row: 2; grid-column: 1 / -1; display: flex; flex-direction: row; align-items: center; padding: 12px 24px; }
    body[data-layout="arena"] .center > * { flex: 1; min-width: 0; }
    body[data-layout="arena"] .center .event-brand { font-size: clamp(12px, 1.3vw, 24px); }
    body[data-layout="arena"] .center .clock { font-size: clamp(28px, 4vw, 68px); }
    body[data-layout="arena"] .team { display: grid; grid-template-columns: 1fr 1fr; }
    body[data-layout="arena"] .stats, body[data-layout="arena"] .lineup { grid-column: 1 / -1; max-height: 14vh; }
    body[data-layout="arena"] .score-box { border: 1px solid var(--accent); border-radius: 10px; }
    body[data-layout="arena"] .team, body[data-layout="arena"] .center { border-radius: 14px; border-color: #ffffffb8; }
    body[data-layout="broadcast"] .team, body[data-layout="broadcast"] .center { border-radius: 6px; background: color-mix(in srgb, var(--base) 94%, transparent); }
    body[data-layout="broadcast"] .team { border-top: 8px solid var(--accent); }
    body[data-layout="broadcast"] .score-box { color: #fff; }
    body[data-layout="venueRoster"] .team, body[data-layout="venueRoster"] .center { border-radius: 4px; }
    body[data-layout="venueRoster"] .lineup { flex: 1; max-height: none; }
    body[data-layout="venueRoster"] .score { font-size: clamp(48px, 7vw, 120px); }
    body[data-layout="venueRoster"] .score-box { flex: 0 0 auto; }
    body[data-layout="venueRoster"] .team-logo { width: 42px; height: 42px; }
    body[data-sport="chess"] .team .score-box, body[data-sport="chess"] .team .stats { display: none; }
    .chess-time { margin: auto 0; color: var(--accent); font-size: clamp(28px, 5vw, 94px); font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
    .chess-time.active { padding: 18px 0; border-block: 2px solid var(--accent); }
    .pause-overlay, #completionOverlay { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 5vw; background: #000b; color: #fff; text-align: center; }
    .pause-logo { width: clamp(64px, 16vh, 190px); height: clamp(64px, 16vh, 190px); object-fit: contain; }
    .pause-overlay strong, #completionOutcome { font-size: clamp(24px, 4.5vw, 80px); overflow-wrap: anywhere; }
    .pause-time, #completionScore { font-size: clamp(48px, 12vw, 180px); font-weight: 900; font-variant-numeric: tabular-nums; }
    #completionOverlay { z-index: 50; background: #000d; }
    #completionLabel, #completionTeams { font-size: clamp(16px, 2vw, 36px); color: #ffffffb3; }
    @media (max-aspect-ratio: 4/3) { .board { width: 98vw; height: min(94vh, 105vw); padding: 12px; } .team, .center { padding: 12px; border-radius: 20px; } .match { gap: 10px; } .name { font-size: clamp(14px, 3vw, 30px); } .stats { gap: 5px; } .stat { padding: 7px; } }
    @media (max-width: 540px) { .board { height: 88vh; } .match { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .center { grid-row: 1; grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; } .center .event-brand { width: 100%; flex-direction: row; justify-content: center; } .center .event-brand img { width: 28px; height: 28px; } .center .clock { font-size: 38px; } .clock-box, .dual-clocks { flex: 1; } .period-box { font-size: 16px; padding: 8px; } .team { grid-row: 2; } .score { font-size: clamp(50px, 17vw, 92px); } .team-role { font-size: 9px; } .name { font-size: 18px; } .shot-box { padding: 4px; font-size: 24px; } .player-row { gap: 4px; grid-template-columns: 1.7em minmax(0, 1fr) auto auto; } .player-panel { padding: 10px; } body[data-layout="arena"] .team { display: flex; } .lineup { max-height: 28%; } }
    @media (prefers-reduced-motion: reduce) { .lineup .player-list { animation: none !important; } }
</style>
</head>
<body>
  <div id="displayBackground" aria-hidden="true"><img id="backgroundPhoto" class="hidden" alt=""></div>
  <time id="dateTime" hidden></time>
  <div id="completionOverlay" role="status" hidden><span id="completionLabel"></span><strong id="completionOutcome"></strong><span id="completionScore"></span><span id="completionTeams"></span></div>
  <div id="status" class="status" role="status"><span class="dot"></span><span data-i18n="connecting">Connecting</span></div>
  <main class="board">
    <div id="sport" class="hidden">SmartScoreboard</div>

    <section id="scoreboardView" class="match">
      <article class="team home">
        <div class="nameplate">
          <img id="homeLogo" class="team-logo hidden" alt="">
          <span id="homeRole" class="team-role"></span>
          <div id="homeName" class="name" data-i18n="home">HOME</div>
        </div>
        <div class="score-box">
          <div id="homeScore" class="score">0</div>
        </div>
        <div id="homeChess" class="chess-time" hidden></div>
        <div id="homeWins" class="period-wins" hidden></div>
        <div id="homePrep" class="prep-time" hidden></div>
        <div class="stats">
          <div id="homeFouls" class="stat">Fouls 0</div>
          <div id="homeSubs" class="stat">Subs 0</div>
          <div id="homePauses" class="stat hidden">Pauses 0</div>
        </div>
        <div id="homePenalties" class="penalties" hidden></div>
        <div id="homeLineup" class="lineup" hidden><div id="homeLineupList" class="player-list"></div></div>
      </article>

      <article class="center">
        <div id="eventBrand" class="event-brand" hidden><img id="boardEventLogo" class="hidden" alt=""><span id="boardEventName"></span></div>
        <div id="dualClocks" class="dual-clocks" hidden><div id="homeDual" class="dual-clock home"><span id="homeDualLabel"></span><strong id="homeDualTime"></strong></div><div id="guestDual" class="dual-clock guest"><span id="guestDualLabel"></span><strong id="guestDualTime"></strong></div></div>
        <div id="period" class="period-box">P 1</div>
        <div class="clock-box">
          <div id="clock" class="clock">00:00</div>
          <div id="injuryTime" class="injury-time hidden">+0 min</div>
        </div>
        <div id="shot" class="shot-box hidden">24.0</div>
        <div id="possession" class="possession-box">Possession Off</div>
      </article>

      <article class="team guest">
        <div class="nameplate">
          <img id="guestLogo" class="team-logo hidden" alt="">
          <span id="guestRole" class="team-role"></span>
          <div id="guestName" class="name" data-i18n="guest">GUEST</div>
        </div>
        <div class="score-box">
          <div id="guestScore" class="score">0</div>
        </div>
        <div id="guestChess" class="chess-time" hidden></div>
        <div id="guestWins" class="period-wins" hidden></div>
        <div id="guestPrep" class="prep-time" hidden></div>
        <div class="stats">
          <div id="guestFouls" class="stat">Fouls 0</div>
          <div id="guestSubs" class="stat">Subs 0</div>
          <div id="guestPauses" class="stat hidden">Pauses 0</div>
        </div>
        <div id="guestPenalties" class="penalties" hidden></div>
        <div id="guestLineup" class="lineup" hidden><div id="guestLineupList" class="player-list"></div></div>
      </article>
    </section>

    <section id="eventView" class="event-view hidden">
      <article class="event-card">
        <img id="eventLogoImage" class="event-logo hidden" alt="">
        <div id="eventLogoTitle" class="event-title">SmartScoreboard</div>
        <div id="eventLogoSubtitle" class="event-subtitle">Live</div>
      </article>
    </section>

    <section id="teamView" class="team-view hidden">
      <article id="teamViewHome" class="team-hero home">
        <img id="teamViewHomeLogo" class="team-hero-logo hidden" alt="">
        <div id="teamViewHomeName" class="team-hero-name">HOME</div>
        <div id="teamViewHomeScore" class="team-hero-score">0</div>
      </article>
      <article id="teamViewGuest" class="team-hero guest">
        <img id="teamViewGuestLogo" class="team-hero-logo hidden" alt="">
        <div id="teamViewGuestName" class="team-hero-name">GUEST</div>
        <div id="teamViewGuestScore" class="team-hero-score">0</div>
      </article>
    </section>

    <section id="playerView" class="player-view hidden">
      <article id="playerViewHome" class="player-panel home">
        <div id="playerViewHomeTitle" class="player-panel-title">HOME</div>
        <div id="playerViewHomeList" class="player-list"></div>
      </article>
      <article id="playerViewGuest" class="player-panel guest">
        <div id="playerViewGuestTitle" class="player-panel-title">GUEST</div>
        <div id="playerViewGuestList" class="player-list"></div>
      </article>
    </section>

    <section class="footer">
      <div id="generated" data-i18n="waiting">Waiting for state</div>
      <div id="mode" data-i18n="mode">Reference WebSocket Demo</div>
    </section>
  </main>

  <div id="pauseOverlay" class="pause-overlay" role="status" hidden><img id="pauseLogo" class="pause-logo hidden" alt=""><strong id="pauseTitle"></strong><span id="pauseTime" class="pause-time"></span><span id="pauseStatus"></span></div>
  <script>
    const translations = {
      en: {
        title: 'Smart Scoreboard',
        connecting: 'Connecting',
        connected: 'Connected',
        reconnecting: 'Reconnecting',
        invalidJSON: 'Invalid JSON',
        socketError: 'Socket Error',
        home: 'HOME',
        guest: 'GUEST',
        fouls: 'Fouls',
        subs: 'Subs',
        pauses: 'Pauses',
        periodPrefix: 'P',
        possession: 'Possession',
        off: 'Off',
        none: 'none',

    function logoURL(logo) {

    function renderPlayerList(containerID, players) {

    function applyPlayerView(state, home, guest, display, runtime) {

    function applyPauseTimer(clocks, teams, display, hidden) {
      const pause = clocks.pauseTimer;
      el('pauseOverlay').hidden = !pause || hidden;
      if (!pause) return;
      const zh = document.documentElement.lang.startsWith('zh');
      const name = pause.side ? ((teams[pause.side] || {}).name || (pause.side === 'home' ? (zh ? '主队' : 'Home Team') : (zh ? '客队' : 'Guest Team'))) : '';
      el('pauseTitle').textContent = pause.side ? `${name}${zh ? '暂停' : ' Pause'}` : (zh ? '官方暂停' : 'Official Pause');

      const eventLogo = display.showsEventLogo !== false ? display.eventLogo : null;
      const logo = logoURL(teamLogo) ? teamLogo : eventLogo;
      applyImage('pauseLogo', logo);
      el('pauseOverlay').classList.toggle('has-logo', Boolean(logoURL(logo)));
      const seconds = pause.remainingSeconds;

      el('pauseTime').hidden = seconds == null;
      el('pauseStatus').hidden = seconds == null;
      el('pauseTime').textContent = seconds == null ? '' : `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
      el('pauseStatus').textContent = seconds == null ? '' : seconds === 0 ? (zh ? '暂停时间到' : 'Pause Timer Expired') : !pause.isRunning ? (zh ? '暂停计时已暂停' : 'Pause Timer Paused') : '';
    }

    function applyCompletion(completion, hidden) {

    function applyState(state) {
      if (!state || !state.teams || !state.clocks) return;

      const home = state.teams.home || {};
      const guest = state.teams.guest || {};
      const rules = state.rules || {};

      applyAppearance(state, mode);

      applyCompletion(game.completion, isBlackoutMode);
      if (isBlackoutMode) return;

      const periodShort = localizedPeriodShort(rules.periodShortTitle);

      if (rules.usesChessClocks) {

      } else {

      const injuryMinutes = Number(clocks.activeInjuryTimeMinutes || 0);

      if (injuryMinutes > 0) el('injuryTime').textContent = `+${injuryMinutes} min`;
      fitClockToOneLine();

      const showShot = Boolean(rules.supportsShotClock);

      el('possession').textContent = `${t('possession')} ${possessionLabel(runtime.possessionDirection)}`;
      el('homeFouls').textContent = `${t('fouls')} ${valueText(home.teamFouls, 0)}`;
      el('guestFouls').textContent = `${t('fouls')} ${valueText(guest.teamFouls, 0)}`;
      el('homeSubs').textContent = `${t('subs')} ${valueText(home.substitutionsRemaining, 0)}`;
      el('guestSubs').textContent = `${t('subs')} ${valueText(guest.substitutionsRemaining, 0)}`;
      applyPauseStats(home, guest, rules);
      applySportDetails(state);
      fitClockToOneLine();
      el('generated').textContent = valueText(state.generatedAt, t('live'));
      const viewMode = valueText(supportedMode, 'scoreboard');
      const rosterScope = valueText(display.playerViewRosterScope, 'fullRoster');
      const backgroundMode = valueText(display.backgroundMode, 'blurred');
      const animatedStyle = backgroundMode === 'animatedLogo'
        ? ` / ${valueText(display.animatedLogoStyle, 'horizontalMarquee')} / ${valueText(display.animatedLogoBackgroundColor, 'themeBackground')} / ${Math.round(valueText(display.animatedLogoOpacity, 0.23) * 100)}%`
        : '';

      const eventName = valueText(game.eventName, '');

      el('mode').textContent = viewMode === 'playerView'
        ? `${t('display')}: ${viewMode}${displayIDStatus} / ${rosterScope} / ${backgroundMode} / ${direction}${animatedStyle}${dateTimeStatus}`
        : viewMode === 'eventLogo' && eventName
          ? `${t('display')}: ${viewMode}${displayIDStatus} / ${eventName} / ${backgroundMode} / ${direction}${animatedStyle}${dateTimeStatus}`
          : `${t('display')}: ${viewMode}${displayIDStatus} / ${backgroundMode} / ${direction}${animatedStyle}${dateTimeStatus}`;
    }

    let latestState = {};
    const lineupPages = new Map();
    const segmentMasks = { '0':63, '1':6, '2':91, '3':79, '4':102, '5':109, '6':125, '7':7, '8':127, '9':111, '-':64 };

    // Keep a text node for accessible names and plain-text consumers of the API demos.
    function displayNumber(element, value, font) {
      const label = String(value);
      if (element.dataset.value === label && element.dataset.font === font && element.querySelector('.number-text')?.textContent === label) return;
      element.dataset.value = label; element.dataset.font = font;
      element.classList.add('number');
      const span = document.createElement('span'); span.className = 'number-text'; span.textContent = label;
      element.replaceChildren(span);
      if (font !== 'eightSegment' || !/^[\d:. -]+$/.test(label)) return;
      span.classList.add('sr-only');
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('aria-hidden', 'true');
      let x = 0;
      const shape = (tag, attributes, opacity = 1) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        node.setAttribute('fill', 'currentColor'); node.setAttribute('opacity', opacity); svg.appendChild(node);
      };
      const horizontal = y => `${x+10},${y} ${x+50},${y} ${x+55},${y+5} ${x+50},${y+10} ${x+10},${y+10} ${x+5},${y+5}`;
      const vertical = (dx, y) => `${x+dx+5},${y} ${x+dx+10},${y+5} ${x+dx+10},${y+34} ${x+dx+5},${y+39} ${x+dx},${y+34} ${x+dx},${y+5}`;
      for (let index = 0; index < label.length; index++) {
        const char = label[index];
        if (char in segmentMasks) {
          let mask = segmentMasks[char];
          if (label[index+1] === '.') { mask |= 128; index++; }
          [horizontal(0), vertical(50,8), vertical(50,53), horizontal(90), vertical(0,53), vertical(0,8), horizontal(45)].forEach((points, bit) => shape('polygon', {points}, mask & (1 << bit) ? 1 : .06));
          shape('circle', {cx:x+70,cy:95,r:5}, mask & 128 ? 1 : .06); x += 84;
        } else if (char === ':') { [30,70].forEach(cy => shape('circle', {cx:x+10,cy,r:5})); x += 28; }
        else if (char === '.') { shape('circle', {cx:x+6,cy:95,r:5}); x += 20; }
        else x += 40;
      }
      svg.setAttribute('viewBox', `0 0 ${Math.max(1, x-8)} 100`); element.appendChild(svg);
    }

    function applyAppearance(state, mode) {
      latestState = state;
      const display = state.display || {}, runtime = state.runtime || {};
      const body = document.body;
      body.dataset.theme = display.theme || 'classic'; body.dataset.layout = display.layout || 'standard'; body.dataset.font = display.font || 'rounded'; body.dataset.sport = (state.rules || {}).sport || '';
      body.dataset.reversed = String((display.direction || (runtime.areSidesSwapped ? 'guestLeft' : 'homeLeft')) === 'guestLeft');
      // Animated Logo is disabled in the native app and resolves to Blurred there.
      body.dataset.background = display.backgroundMode === 'animatedLogo' ? 'blurred' : display.backgroundMode || 'blurred';
      body.classList.toggle('blackout', mode === 'blackScreen'); body.classList.toggle('background-only', mode === 'backgroundOnly');
      const photo = el('backgroundPhoto');
      applyImage('backgroundPhoto', display.backgroundMode === 'image' ? display.backgroundImage : null);
      const metadata = display.backgroundImage?.placement || {};
      photo.style.setProperty('--photo-scale', Math.max(1, Math.min(3, Number(metadata.scale) || 1)));
      photo.style.setProperty('--photo-x', `${Math.max(-1, Math.min(1, Number(metadata.offsetX) || 0)) * 50}vw`);
      photo.style.setProperty('--photo-y', `${Math.max(-1, Math.min(1, Number(metadata.offsetY) || 0)) * 50}vh`);
      const transparent = ['clearUnderBoard', 'image', 'smartScoreboard', 'none'].includes(body.dataset.background);
      body.style.setProperty('--panel', transparent ? '#000c' : ''); body.style.setProperty('--clock-panel', transparent ? '#000d' : '');
      body.style.setProperty('--foul-color', {red:'#fb6262',orange:'#ffad50',yellow:'#facc15'}[(state.players || {}).foulHighlightColor] || '#fb6262');
      updateDateTime();
    }

    function updateDateTime() {
      const display = latestState.display || {}, mode = displayMode(display);
      const node = el('dateTime'); node.hidden = !display.showsDateTime || mode === 'blackScreen';
      if (node.hidden) return;
      const format = display.dateTimeFormat || 'time24Hour';
      const options = {hour: '2-digit', minute: '2-digit', hour12: format.includes('12Hour')};
      if (display.showsDateTimeSeconds !== false) options.second = '2-digit';
      if (format.startsWith('dateTime')) Object.assign(options, {month: 'short', day: 'numeric'});
      node.textContent = new Intl.DateTimeFormat(document.documentElement.lang, options).format(new Date());
    }

    function setStat(id, label, value, allowed, used) {
      const node = el(id); const title = document.createElement('span'); title.className = 'stat-title'; title.textContent = label;
      const count = document.createElement('strong'); count.textContent = value;
      node.replaceChildren(title, count);
      if (Number(allowed) > 0) {
        const lights = document.createElement('span'); lights.className = 'allowances'; lights.setAttribute('aria-hidden', 'true');
        for (let index = 0; index < Math.min(30, allowed); index++) { const light = document.createElement('i'); light.className = 'allowance' + (index < Number(used || 0) ? ' used' : ''); lights.appendChild(light); }
        node.appendChild(lights);
      }
    }

    function applySportDetails(state) {
      const {rules = {}, clocks = {}, teams = {}, game = {}, display = {}, players = {}, runtime = {}} = state;
      const debate = state.debate;
      const zh = document.documentElement.lang.startsWith('zh');
      const font = display.font || 'rounded';
      const dual = Boolean(rules.usesChessClocks || (debate && debate.segmentTimerMode === 'dualClock'));
      el('dualClocks').hidden = !dual || rules.sport === 'chess';
      document.querySelector('.clock-box').classList.toggle('hidden', dual || clocks.showsGameClock === false);
      document.querySelector('.center').classList.toggle('running', Boolean(runtime.isClockRunning));
      el('period').classList.toggle('hidden', rules.supportsPeriod === false && !debate);
      if (debate) el('period').textContent = debate.segmentTitle || debate.presetTitle;
      el('possession').classList.toggle('hidden', !rules.supportsPossession && !debate?.speakingSide);
      if (debate?.speakingSide) el('possession').textContent = `${zh ? '发言' : 'Speaking'} · ${debate.speakingSide === 'home' ? debate.homeSideLabel : debate.guestSideLabel}`;
      else if (rules.supportsPossession) {
        const direction = display.direction || (runtime.areSidesSwapped ? 'guestLeft' : 'homeLeft');
        const side = runtime.possessionDirection;
        el('possession').textContent = !side || side === 'none' ? '' : `${(side === 'home') === (direction !== 'guestLeft') ? '◀' : '▶'} ${t('possession')}`;
      }
      const eventLogo = display.showsEventLogo === false ? null : display.eventLogo;
      applyImage('boardEventLogo', eventLogo);
      el('boardEventName').textContent = game.eventName || '';
      el('eventBrand').hidden = !game.eventName && !logoURL(eventLogo);
      for (const side of ['home', 'guest']) {
        const team = teams[side] || {};
        el(`${side}Role`).textContent = debate ? (side === 'home' ? debate.homeSideLabel : debate.guestSideLabel) : team.roleLabel || t(side);
        const score = el(`${side}Score`);
        score.parentElement.classList.toggle('hidden', rules.supportsScore === false || debate?.scoreTrackingEnabled === false || rules.sport === 'chess');
        displayNumber(score, team.score ?? 0, font);
        el(`${side}Wins`).hidden = !rules.supportsPeriodWins;
        el(`${side}Wins`).textContent = `${zh ? '胜局' : 'Wins'}  ${team.periodsWon ?? team.setsWon ?? 0}`;
        el(`${side}Fouls`).classList.toggle('hidden', rules.supportsTeamFouls === false || (!rules.supportsTeamFouls && !rules.supportsFouls));
        el(`${side}Subs`).classList.toggle('hidden', !rules.supportsSubstitutions);
        el(`${side}Pauses`).classList.toggle('hidden', !rules.supportsPauses);
        setStat(`${side}Fouls`, t('fouls'), team.teamFouls ?? 0);
        setStat(`${side}Subs`, t('subs'), team.substitutionsRemaining ?? 0, team.substitutionsAllowed, team.substitutionsUsed);
        setStat(`${side}Pauses`, t('pauses'), team.pausesRemaining ?? 0, team.pausesAllowed, team.pausesUsed);
        el(`${side}Prep`).hidden = !debate?.prepTimeEnabled;
        el(`${side}Prep`).textContent = `${zh ? '准备' : 'Prep'}  ${debate?.[side === 'home' ? 'formattedPrepHomeClock' : 'formattedPrepGuestClock'] || '00:00'}`;
        const clock = clocks[side === 'home' ? 'formattedHomeChessClock' : 'formattedGuestChessClock'] || '00:00';
        el(`${side}Chess`).hidden = rules.sport !== 'chess';
        displayNumber(el(`${side}Chess`), clock, font);
        el(`${side}Chess`).classList.toggle('active', clocks.activeChessClockSide === side);
        el(`${side}DualLabel`).textContent = debate ? (side === 'home' ? debate.homeSideLabel : debate.guestSideLabel) : team.name || t(side);
        displayNumber(el(`${side}DualTime`), clock, font);
        el(`${side}Dual`).classList.toggle('active', clocks.activeChessClockSide === side);
        const penalties = el(`${side}Penalties`); penalties.replaceChildren(); penalties.hidden = !rules.supportsHockeyPenalties;
        for (const penalty of team.penaltyTimers || []) {
          const row = document.createElement('div'); row.className = 'penalty';
          const name = document.createElement('span'); name.textContent = [penalty.playerNumber ? `#${penalty.playerNumber}` : '', penalty.playerName].filter(Boolean).join(' ') || (zh ? '罚时' : 'Penalty');
          const time = document.createElement('strong'), seconds = Math.max(0, Number(penalty.remainingSeconds) || 0);
          time.textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
          row.append(name, time); penalties.appendChild(row);
        }
        renderLineup(side, state);
      }
      displayNumber(el('clock'), clocks.formattedGameClock || '00:00', font);
      displayNumber(el('shot'), clocks.formattedShotClock || '0.0', font);
      el('clock').classList.toggle('timer-alert', clocks.gameClockSeconds === 0 && clocks.showsGameClock !== false);
      el('shot').classList.toggle('timer-alert', rules.supportsShotClock && clocks.shotClockMilliseconds === 0);
    }

    function renderLineup(side, state) {
      const players = state.players || {}, display = state.display || {};
      const venue = display.layout === 'venueRoster';
      const lineup = el(`${side}Lineup`), list = el(`${side}LineupList`);
      lineup.hidden = !players.isPlayerTrackingEnabled || players.isPlayerOverlayPaused;
      if (lineup.hidden) return;
      const all = venue ? (players[`${side}Roster`]?.players || players[`${side}Displayed`] || []) : players[`${side}Displayed`] || [];
      const hasLogo = display.showsTeamLogos !== false && Boolean(state.teams?.[side]?.logo);
      const overflow = (hasLogo ? players.lineupOverflowLogoOverride : players.lineupOverflowNoLogoOverride) || players.lineupOverflowMode || 'scroll';
      lineup.dataset.overflow = overflow; lineup.dataset.direction = players.lineupScrollMode || 'bounce';
      const scrollMode = players.lineupScrollMode || 'bounce';
      const continuous = overflow === 'scroll' && scrollMode.startsWith('continuous');
      const signature = JSON.stringify([all, overflow, scrollMode, players.foulHighlightColor]);
      if (lineup.dataset.signature !== signature) {
        lineup.dataset.signature = signature; lineupPages.delete(side); renderPlayerList(list.id, all);
        if (continuous && list.children.length) {
          const repeated = [...list.children].map(row => { const clone = row.cloneNode(true); clone.setAttribute('aria-hidden', 'true'); return clone; });
          list.append(...repeated);
        }
      }
      const pageSeconds = Math.max(1, Number(players.lineupFadePageSeconds) || 5);
      lineup.style.setProperty('--page-seconds', `${pageSeconds}s`);
      lineup.style.setProperty('--lineup-size', `${Math.min(1.2, 18 / Math.max(1, all.length))}vw`);
      if (overflow === 'fade') {
        const page = Math.floor(Date.now() / (pageSeconds * 1000)) % Math.max(1, Math.ceil(all.length / 4));
        if (lineupPages.get(side) !== page) { lineupPages.set(side, page); renderPlayerList(list.id, all.slice(page*4, page*4+4)); }
      }
      const fullHeight = continuous ? list.scrollHeight / 2 : list.scrollHeight;
      const travel = Math.max(0, fullHeight - lineup.clientHeight);
      lineup.style.setProperty('--lineup-cycle', `${-fullHeight}px`);
      lineup.style.setProperty('--lineup-viewport', `${lineup.clientHeight}px`);
      lineup.style.setProperty('--lineup-end', `${-fullHeight}px`);
      lineup.classList.toggle('has-overflow', travel > 0);
      lineup.style.setProperty('--lineup-travel', `${-travel}px`);
      lineup.style.setProperty('--lineup-duration', `${Math.max(4, (scrollMode === 'bounce' ? travel : fullHeight + lineup.clientHeight) / Math.max(8, Number(players.lineupScrollSpeed) || 28))}s`);
    }

    setInterval(() => {
      updateDateTime();
      if (latestState.teams && displayMode(latestState.display || {}) === 'scoreboard') for (const side of ['home', 'guest']) renderLineup(side, latestState);
    }, 1000);

    function handleV2Message(message) {
      if (!message || message.schemaVersion !== 2) return;
      if (message.type === 'scoreboard.v2.manifest') return;
      if (message.type !== 'scoreboard.v2.resource') return;

      const envelope = message.payload || {};
      const resource = message.resource || envelope.resource;
      if (!resource) return;

      v2State[resource] = envelope.data;
      if (envelope.generatedAt) v2State.generatedAt = envelope.generatedAt;
      if (envelope.generatedAtUnixTime !== undefined) v2State.generatedAtUnixTime = envelope.generatedAtUnixTime;
      applyState(v2State);
    }

    function connect() {
      clearTimeout(reconnectTimer);
      setStatus(t('connecting'), false);
      socket = new WebSocket(wsURL);
      socket.onopen = () => {
        setStatus(t('connected'), true);
        Object.keys(v2State).forEach(key => delete v2State[key]);
        socket.send(JSON.stringify({ type: 'subscribe', apiVersion: 'v2' }));
      };
      socket.onmessage = event => {
        try {
          handleV2Message(JSON.parse(event.data));
        } catch {
          setStatus(t('invalidJSON'), false);
        }
      };
      socket.onclose = () => {
        setStatus(t('reconnecting'), false);
        reconnectTimer = setTimeout(connect, 1200);
      };
      socket.onerror = () => {
        setStatus(t('socketError'), false);
      };
    }

    localizeStaticText();
    connect();
    window.addEventListener('resize', () => { if (latestState.teams) applyState(latestState); });
  </script>
</body>
</html>
