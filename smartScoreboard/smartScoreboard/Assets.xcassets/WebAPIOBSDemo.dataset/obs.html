<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartScoreboard OBS Source</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f5f8ff; background: transparent; --home: #82c3ff; --guest: #ff9ba2; }
    * { box-sizing: border-box; }
    [hidden], .hidden { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .home { --accent: var(--home); } .guest { --accent: var(--guest); }
    body.blackout main, body.blackout::after { display: none !important; }
    .scorebug { position: absolute; left: 4vw; bottom: 10.4vh; width: 92vw; display: flex; align-items: stretch; filter: drop-shadow(0 18px 30px #0005); border-radius: 14px; }
    .teams { display: contents; }
    .team { flex: 1; min-width: 0; min-height: clamp(60px, 9.7vh, 112px); display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; background: #101c2b; border-left: 6px solid var(--accent); }
    .team.has-logo { grid-template-columns: auto minmax(0, 1fr) auto auto; }
    .team-logo, .logo { width: clamp(26px, 3vw, 46px); height: clamp(26px, 3vw, 46px); margin-left: 12px; object-fit: contain; }
    .name { min-width: 0; padding: 12px 16px; font-size: clamp(14px, 2vw, 34px); font-weight: 800; line-height: 1.12; overflow-wrap: anywhere; text-wrap: balance; }
    .score-wrap { position: relative; align-self: stretch; min-width: clamp(42px, 5vw, 96px); display: grid; place-items: center; background: #f8fafc; color: #101623; }
    .score { width: 100%; text-align: center; font-size: clamp(26px, 3vw, 54px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; padding: 8px; }
    .team-pause { padding: 5px 8px; margin-right: 10px; border-radius: 6px; background: #ffffff17; font-size: clamp(9px, .85vw, 14px); font-weight: 800; white-space: nowrap; }
    .clockbox { order: 2; flex: 0 0 clamp(110px, 12vw, 220px); display: grid; grid-template-rows: auto 1fr auto; background: #f8fafcf5; color: #101623; text-align: center; }
    .period { font-size: clamp(10px, 1vw, 16px); font-weight: 800; padding: 8px 6px 0; }
    .clock { min-width: 0; font-size: clamp(24px, 2.6vw, 46px); font-weight: 900; font-variant-numeric: tabular-nums; padding: 4px 6px; white-space: nowrap; align-self: center; }
    .extra { font-size: clamp(9px, .85vw, 14px); font-weight: 800; padding: 0 6px 8px; }
    .extra.injury { color: #a04d00; }
    .scorebug .team.home { order: 1; } .scorebug .team.guest { order: 3; }
    .scorebug[data-reversed="true"] .home { order: 3 !important; } .scorebug[data-reversed="true"] .guest { order: 1 !important; }
    .scorebug:not([data-reversed="true"]) .guest, .scorebug[data-reversed="true"] .home { direction: rtl; border-left: 0; border-right: 6px solid var(--accent); }
    .scorebug .team > * { direction: ltr; }
    .scorebug:not([data-reversed="true"]) .guest .logo, .scorebug[data-reversed="true"] .home .logo { margin: 0 12px 0 0; }
    .scorebug:not([data-reversed="true"]) .guest .team-pause, .scorebug[data-reversed="true"] .home .team-pause { margin: 0 0 0 10px; }
    .event-bug, .team-bug, .player-bug { position: absolute; inset: 10vh 4vw; width: 92vw; height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: clamp(16px, 2.1vw, 40px); background: #08101b9e; border: 1px solid #e1eeff33; border-radius: 24px; box-shadow: 0 20px 64px #0004; }
    .event-logo { width: min(44vw, 45vh); height: min(44vw, 45vh); object-fit: contain; }
    .event-copy { display: grid; gap: 12px; text-align: center; }
    .event-title, .presentation-title { margin: 0; font-size: clamp(24px, 3.2vw, 60px); font-weight: 800; line-height: 1.1; letter-spacing: -.035em; overflow-wrap: anywhere; text-wrap: balance; text-align: center; }
    .event-subtitle { display: none; }
    .presentation-title:empty { display: none; }
    .team-grid { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .team-card { min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; padding: 28px; background: #101c2b; border: 1px solid #e1eeff22; border-radius: 18px; }
    .team-card-logo { width: min(25vw, 32vh); height: min(25vw, 32vh); object-fit: contain; }
    .team-card-name { font-size: clamp(22px, 3vw, 50px); font-weight: 800; line-height: 1.1; text-align: center; overflow-wrap: anywhere; text-wrap: balance; color: var(--accent); }
    .team-card-score { display: none; }
    .player-bug { justify-content: start; }
    .player-columns { min-height: 0; flex: 1; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .player-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 12px; }
    .player-panel-title { padding: 16px 18px; border-radius: 12px; background: #101c2b; color: var(--accent); font-size: clamp(18px, 2vw, 32px); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
    .player-list { min-height: 0; flex: 1; display: grid; grid-auto-rows: minmax(0, 1fr); gap: 4px; }
    .player-row { min-height: 0; min-width: 0; display: grid; grid-template-columns: 2.5em minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 3px 14px; border: 1px solid #223144; border-radius: 10px; background: #101b2a; font-size: clamp(11px, min(1.25vw, var(--roster-font, 2.2vh)), 22px); font-weight: 650; }
    .player-number { color: #92a8bf; font-weight: 800; font-variant-numeric: tabular-nums; }
    .player-name { overflow-wrap: anywhere; line-height: 1.1; }
    .player-meta { color: #a6b7cb; font-size: .8em; white-space: nowrap; }
    .player-row[data-card="yellow"] .player-meta { color: #facc15; } .player-row[data-card="red"] .player-meta { color: #fb5268; }
    .empty-players { padding: 20px; border-radius: 10px; color: #a6b7cb; background: #101b2a; text-align: center; }
    main[data-motion="entering"] { animation: panel-in 520ms cubic-bezier(.2,.8,.2,1) both; }
    main[data-motion="exiting"] { animation: panel-out 360ms cubic-bezier(.4,0,.8,.2) both; }
    #scorebug[data-motion="entering"] { animation: scorebar-in 520ms cubic-bezier(.2,.8,.2,1) both; }
    #scorebug[data-motion="exiting"] { animation: scorebar-out 360ms ease-in both; }
    @keyframes panel-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes panel-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.97); } }
    @keyframes scorebar-in { from { opacity: 0; clip-path: inset(-100vh 50% -100vh 50%); } to { opacity: 1; clip-path: inset(-100vh -10% -100vh -10%); } }
    @keyframes scorebar-out { from { opacity: 1; clip-path: inset(-100vh -10% -100vh -10%); } to { opacity: 0; clip-path: inset(-100vh 50% -100vh 50%); } }
    .score-change { position: absolute; inset: 0; z-index: 2; background: #f8fafc; pointer-events: none; }
    .score-old, .score-new { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(26px, 3vw, 54px); font-weight: 900; }
    .score-old { animation: score-old-out 1100ms both; } .score-new { animation: score-new-in 1100ms both; }
    .score-delta { position: absolute; left: 50%; top: -14px; padding: 4px 10px; border-radius: 99px; background: #0ea5e9; color: #fff; font-size: 24px; font-weight: 900; animation: score-bonus 1100ms both; }
    .guest .score-delta { background: #e85267; }
    @keyframes score-old-out { 0%,25% { opacity: 1; transform: translateY(0); } 55%,100% { opacity: 0; transform: translateY(-24px); } }
    @keyframes score-new-in { 0%,35% { opacity: 0; transform: translateY(24px); } 70%,100% { opacity: 1; transform: translateY(0); } }
    @keyframes score-bonus { 0% { opacity: 0; transform: translate(-50%,10px) scale(.7); } 18%,62% { opacity: 1; transform: translate(-50%,0) scale(1); } 100% { opacity: 0; transform: translate(-50%,-14px) scale(.9); } }
    .broadcast-toast { position: absolute; z-index: 5; top: calc(100% + 12px); left: 50%; width: min(100%, 1100px); padding: 12px 20px; border-radius: 12px; border: 1px solid #ffffff30; border-left: 6px solid #f9b84a; background: #101c2b; font-size: clamp(12px, 1.4vw, 25px); font-weight: 700; text-align: center; overflow-wrap: anywhere; transform: translateX(-50%); }
    .broadcast-toast[data-kind="yellow"] { border-left-color: #facc15; } .broadcast-toast[data-kind="red"] { border-left-color: #fb5268; }
    .broadcast-toast[data-motion="entering"] { animation: toast-in 300ms both; } .broadcast-toast[data-motion="exiting"] { animation: toast-out 260ms both; }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%,12px); } to { opacity: 1; transform: translate(-50%,0); } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translate(-50%,8px); } }
    #scorePowered { position: absolute; left: 50%; bottom: 100%; width: min(28vw, 520px); padding-bottom: 12px; overflow: hidden; transform: translateX(-50%); }
    #scorePowered img { width: 100%; height: auto; display: block; }
    #scorePowered[data-motion="entering"] img { animation: powered-rise 420ms both; } #scorePowered[data-motion="exiting"] img { animation: powered-drop 360ms both; }
    @keyframes powered-rise { from { opacity: 0; transform: translateY(100%) scale(.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes powered-drop { from { opacity: 1; } to { opacity: 0; transform: translateY(100%) scale(.9); } }
    #scenePowered { position: fixed; bottom: 1.2vh; left: 50%; width: min(22vw, 360px); height: 7vh; object-fit: contain; transform: translateX(-50%); }
    .disconnected::after { content: attr(data-disconnected-label); position: absolute; left: 4vw; top: 3vh; padding: 8px 12px; border-radius: 99px; background: #7f1d1de6; font-size: 12px; font-weight: 700; }
    .pause-overlay, #completionOverlay { position: absolute; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 1200px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 4vw; border: 1px solid #e1eeff33; border-radius: 24px; background: #08101bd9; text-align: center; }
    .pause-logo { width: min(14vw, 160px); height: min(14vw, 160px); object-fit: contain; }
    .pause-overlay strong, #completionOutcome { font-size: clamp(22px, 4vw, 70px); overflow-wrap: anywhere; }
    .pause-time, #completionScore { font-size: clamp(40px, 9vw, 150px); font-weight: 900; font-variant-numeric: tabular-nums; }
    #completionOverlay { z-index: 50; } #completionLabel, #completionTeams { font-size: clamp(14px, 2vw, 32px); opacity: .75; }
    .timer-alert { color: #ef4444; }
    @media (max-width: 800px) { .name { padding: 8px; font-size: 14px; } .logo { margin-left: 6px; } .team { border-width: 3px; } .team-pause { margin-right: 4px; padding: 4px; } .team-card { padding: 14px; gap: 18px; } .player-columns { gap: 10px; } .player-panel-title { padding: 12px; font-size: 18px; } .player-row { grid-template-columns: 1.8em minmax(0, 1fr) auto; gap: 4px; padding: 3px 7px; } }
</style>
</head>
<body class="disconnected" data-disconnected-label="WebSocket disconnected">
  <div id="completionOverlay" role="status" hidden><span id="completionLabel"></span><strong id="completionOutcome"></strong><span id="completionScore"></span><span id="completionTeams"></span></div>
  <main id="scorebug" class="scorebug hidden">
    <section class="teams">
      <div class="team home">
        <img id="homeLogo" class="logo hidden" alt="">
        <div id="homeName" class="name" data-i18n="home">HOME</div>
        <div id="homePause" class="team-pause hidden">PA 0</div>
        <div class="score-wrap"><div id="homeScore" class="score">0</div></div>
      </div>
      <div class="team guest">
        <img id="guestLogo" class="logo hidden" alt="">
        <div id="guestName" class="name" data-i18n="guest">GUEST</div>
        <div id="guestPause" class="team-pause hidden">PA 0</div>
        <div class="score-wrap"><div id="guestScore" class="score">0</div></div>
      </div>
    </section>
    <section class="clockbox">
      <div id="period" class="period">P 1</div>
      <div id="clock" class="clock">00:00</div>
      <div id="extra" class="extra">Live</div>
    </section>
    <div id="scorePowered" hidden><img src="/demo/powered.png" alt="GameData powered by Smart Scoreboard"></div>
    <div id="foulToast" class="broadcast-toast" role="status" hidden></div>
  </main>

  <main id="eventBug" class="event-bug hidden">
    <img id="eventBugLogo" class="event-logo hidden" alt="">
    <section class="event-copy">
      <div id="eventBugTitle" class="event-title">SmartScoreboard</div>
      <div id="eventBugSubtitle" class="event-subtitle">Live</div>
    </section>
  </main>

  <main id="teamBug" class="team-bug hidden">
    <h1 id="teamEventName" class="presentation-title"></h1>
    <div class="team-grid">
    <section id="teamBugHome" class="team-card home">
      <img id="teamBugHomeLogo" class="team-card-logo hidden" alt="">
      <div id="teamBugHomeName" class="team-card-name">HOME</div>
      <div id="teamBugHomeScore" class="team-card-score">0</div>
    </section>
    <section id="teamBugGuest" class="team-card guest">
      <img id="teamBugGuestLogo" class="team-card-logo hidden" alt="">
      <div id="teamBugGuestName" class="team-card-name">GUEST</div>
      <div id="teamBugGuestScore" class="team-card-score">0</div>
    </section>
    </div>
  </main>

  <main id="playerBug" class="player-bug hidden">
    <h1 id="playerEventName" class="presentation-title"></h1>
    <div class="player-columns">
    <section id="playerBugHome" class="player-panel home">
      <div id="playerBugHomeTitle" class="player-panel-title">HOME</div>
      <div id="playerBugHomeList" class="player-list"></div>
    </section>
    <section id="playerBugGuest" class="player-panel guest">
      <div id="playerBugGuestTitle" class="player-panel-title">GUEST</div>
      <div id="playerBugGuestList" class="player-list"></div>
    </section>
    </div>
  </main>
  <img id="scenePowered" src="/demo/powered.png" alt="GameData powered by Smart Scoreboard" hidden>

  <div id="pauseOverlay" class="pause-overlay" role="status" hidden><img id="pauseLogo" class="pause-logo hidden" alt=""><strong id="pauseTitle"></strong><span id="pauseTime" class="pause-time"></span><span id="pauseStatus"></span></div>
  <script>
    const translations = {
      en: {
        title: 'SmartScoreboard OBS Source',
        home: 'HOME',
        guest: 'GUEST',
        periodPrefix: 'P',
        live: 'Live',
        shotClockShort: 'SC',
        pauseShort: 'PA',
        eventLogo: 'Event Logo',
        noPlayers: 'No players',
        foulShort: 'F',
        disconnected: 'WebSocket disconnected'
      },
      zh: {
        title: 'SmartScoreboard OBS 源',
        home: '主队',
        guest: '客队',
        periodPrefix: '节',
        live: '实时',
        shotClockShort: '进攻',
        pauseShort: '停',
        eventLogo: '赛事标志',
        noPlayers: '暂无球员',
        foulShort: '犯',
        disconnected: 'WebSocket 已断开'
      }
    };

    const preferredLanguages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    const language = preferredLanguages.some(value => value.toLowerCase().startsWith('zh')) ? 'zh' : 'en';
    const strings = translations[language];
    const host = location.hostname || '127.0.0.1';
    const wsURL = `ws://${host}:5517/api/v2/ws`;
    const displayID = requestedDisplayID(2);
    const v2State = {};
    let socket;
    let reconnectTimer;

    const el = id => document.getElementById(id);

    function t(key) {
      return strings[key] || translations.en[key] || key;
    }

    function localizeStaticText() {
      document.documentElement.lang = language === 'zh' ? 'zh-Hans' : 'en';
      document.title = t('title');
      document.body.dataset.disconnectedLabel = t('disconnected');
      document.querySelectorAll('[data-i18n]').forEach(element => {
        element.textContent = t(element.dataset.i18n);
      });
      el('period').textContent = `${t('periodPrefix')} 1`;
      el('extra').textContent = t('live');
      el('homePause').textContent = `${t('pauseShort')} 0`;
      el('guestPause').textContent = `${t('pauseShort')} 0`;
    }

    function text(value, fallback) {
      if (value === null || value === undefined || value === '') return fallback;
      return String(value);
    }

    function localizedPeriodShort(value) {
      const raw = text(value, t('periodPrefix'));
      return raw === translations.en.periodPrefix ? t('periodPrefix') : raw;
    }

    function setConnected(isConnected) {
      document.body.classList.toggle('disconnected', !isConnected);
      if (!isConnected) { transitionScene(null); scoreSnapshot = null; playerSnapshots.clear(); }
    }

    function logoURL(logo) {
      if (!logo || !logo.path) return '';
      if (/^(blob:|data:)/.test(logo.path)) return logo.path;
      const version = logo.id || logo.updatedAtUnixTime || '';
      return version ? `${logo.path}${logo.path.includes('?') ? '&' : '?'}v=${encodeURIComponent(version)}` : logo.path;
    }

    function applyLogo(elementID, logo) {
      const image = el(elementID);
      const url = logoURL(logo);
      image.closest('.team').classList.toggle('has-logo', Boolean(url));
      image.classList.toggle('hidden', !url);
      if (!url) {
        image.removeAttribute('src');
        return;
      }
      if (image.getAttribute('src') !== url) {
        image.src = url;
      }
    }

    function applyImage(elementID, metadata) {
      const image = el(elementID);
      const url = logoURL(metadata);
      image.classList.toggle('hidden', !url);
      if (!url) {
        image.removeAttribute('src');
        return;
      }
      if (image.getAttribute('src') !== url) {
        image.src = url;
      }
    }

    function setActiveView(mode) { transitionScene(mode); }

    function applyDisplayDirection(display, runtime) {
      const direction = text(display.direction, runtime.areSidesSwapped ? 'guestLeft' : 'homeLeft');
      const guestLeft = direction === 'guestLeft';
      el('scorebug').dataset.reversed = String(guestLeft);
      document.querySelector('.team.home').style.order = guestLeft ? '3' : '1';
      document.querySelector('.team.guest').style.order = guestLeft ? '1' : '3';
    }

    function fitClockToOneLine() {
      const clock = el('clock');
      clock.style.fontSize = '';
      let size = parseFloat(getComputedStyle(clock).fontSize);
      while (clock.scrollWidth > clock.clientWidth && size > 18) {
        size -= 1;
        clock.style.fontSize = `${size}px`;
      }
    }

    function requestedDisplayID(defaultID) {
      const params = new URLSearchParams(location.search);
      const raw = params.get('displayId') || params.get('displayID') || params.get('id');
      const value = Number.parseInt(raw, 10);
      return Number.isInteger(value) && value >= 0 && value <= 8 ? value : defaultID;
    }

    function broadcastAssignment(display) {
      const broadcast = display.broadcastControl || {};
      const assignments = Array.isArray(broadcast.assignments) ? broadcast.assignments : [];
      return assignments.find(assignment => Number(assignment.displayID) === displayID);
    }

    function displayMode(display) {
      const assignment = broadcastAssignment(display);
      if (assignment && assignment.effectiveRenderMode) return assignment.effectiveRenderMode;
      return (display.controlStatus && display.controlStatus.currentMode) || display.viewMode || 'scoreboard';
    }

    function applyEventBug(game, rules, display) {
      applyImage('eventBugLogo', display.showsEventLogo === false ? null : display.eventLogo);
      const eventName = text(game.eventName, '');
      el('eventBugTitle').textContent = eventName || text(rules.title, 'SmartScoreboard');
      el('eventBugSubtitle').textContent = eventName ? text(rules.title, t('live')) : t('eventLogo');
    }

    function applyTeamBug(home, guest, display, runtime) {
      const direction = text(display.direction, runtime.areSidesSwapped ? 'guestLeft' : 'homeLeft');
      const guestLeft = direction === 'guestLeft';
      el('teamBugHome').style.order = guestLeft ? '2' : '1';
      el('teamBugGuest').style.order = guestLeft ? '1' : '2';
      applyImage('teamBugHomeLogo', display.showsTeamLogos === false ? null : home.logo);
      applyImage('teamBugGuestLogo', display.showsTeamLogos === false ? null : guest.logo);
      el('teamBugHomeName').textContent = text(home.name, t('home'));
      el('teamBugGuestName').textContent = text(guest.name, t('guest'));
      el('teamBugHomeScore').textContent = text(home.score, 0);
      el('teamBugGuestScore').textContent = text(guest.score, 0);
    }

    function playersForSide(players, side, display) {
      const displayed = players[`${side}Displayed`] || [];
      const roster = players[`${side}Roster`] && players[`${side}Roster`].players ? players[`${side}Roster`].players : [];
      return text(display.playerViewRosterScope, 'fullRoster') === 'fullRoster' && roster.length ? roster : displayed;
    }

    function renderPlayerList(containerID, players) {
      const container = el(containerID);
      container.replaceChildren();
      if (!players.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-players';
        empty.textContent = t('noPlayers');
        container.appendChild(empty);
        return;
      }
      container.style.setProperty('--roster-font', `${Math.min(2.2, 48 / Math.max(1, players.length))}vh`);
      players.forEach(player => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.dataset.card = player.cardStatus || 'none';

        const number = document.createElement('div');
        number.className = 'player-number';
        number.textContent = text(player.number, '--');

        const name = document.createElement('div');
        name.className = 'player-name';
        name.textContent = text(player.name, player.number ? `#${player.number}` : t('live'));

        const meta = document.createElement('div');
        meta.className = 'player-meta';
        const card = player.cardStatus === 'yellow' ? 'Y' : player.cardStatus === 'red' ? 'R' : '';
        meta.textContent = card ? `${t('foulShort')} ${text(player.foulCount, 0)} ${card}` : `${t('foulShort')} ${text(player.foulCount, 0)}`;

        row.append(number, name, meta);
        container.appendChild(row);
      });
    }

    function applyPlayerBug(state, home, guest, display, runtime) {
      const direction = text(display.direction, runtime.areSidesSwapped ? 'guestLeft' : 'homeLeft');
      const guestLeft = direction === 'guestLeft';
      el('playerBugHome').style.order = guestLeft ? '2' : '1';
      el('playerBugGuest').style.order = guestLeft ? '1' : '2';
      el('playerBugHomeTitle').textContent = text(home.name, t('home'));
      el('playerBugGuestTitle').textContent = text(guest.name, t('guest'));
      const players = state.players || {};
      renderPlayerList('playerBugHomeList', playersForSide(players, 'home', display));
      renderPlayerList('playerBugGuestList', playersForSide(players, 'guest', display));
    }

    function applyPauseCounters(home, guest, rules) {
      const showPauses = Boolean(rules.supportsPauses);
      el('homePause').classList.toggle('hidden', !showPauses);
      el('guestPause').classList.toggle('hidden', !showPauses);
      if (!showPauses) return;
      el('homePause').textContent = `${t('pauseShort')} ${text(home.pausesRemaining, 0)}`;
      el('guestPause').textContent = `${t('pauseShort')} ${text(guest.pausesRemaining, 0)}`;
    }

    function applyPauseTimer(clocks, teams, display, hidden) {
      const pause = clocks.pauseTimer;
      el('pauseOverlay').hidden = !pause || hidden;
      if (!pause) return;
      const zh = document.documentElement.lang.startsWith('zh');
      const name = pause.side ? ((teams[pause.side] || {}).name || (pause.side === 'home' ? (zh ? '主队' : 'Home Team') : (zh ? '客队' : 'Guest Team'))) : '';
      el('pauseTitle').textContent = pause.side ? `${name}${zh ? '暂停' : ' Pause'}` : (zh ? '官方暂停' : 'Official Pause');
      const teamLogo = pause.side && display.showsTeamLogos !== false ? (teams[pause.side] || {}).logo : null;
      const eventLogo = display.showsEventLogo !== false ? display.eventLogo : null;
      const logo = logoURL(teamLogo) ? teamLogo : eventLogo;
      applyImage('pauseLogo', logo);
      el('pauseOverlay').classList.toggle('has-logo', Boolean(logoURL(logo)));
      const seconds = pause.remainingSeconds;
      el('pauseOverlay').classList.toggle('indefinite', seconds == null);
      el('pauseTime').hidden = seconds == null;
      el('pauseStatus').hidden = seconds == null;
      el('pauseTime').textContent = seconds == null ? '' : `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
      el('pauseStatus').textContent = seconds == null ? '' : seconds === 0 ? (zh ? '暂停时间到' : 'Pause Timer Expired') : !pause.isRunning ? (zh ? '暂停计时已暂停' : 'Pause Timer Paused') : '';
    }

    function applyCompletion(completion, hidden) {
      el('completionOverlay').hidden = !completion || hidden;
      if (!completion) return;
      const zh = document.documentElement.lang.startsWith('zh');
      el('completionLabel').textContent = zh ? '最终结果' : 'Final Result';
      const winner = completion.outcome === 'homeWin' ? completion.homeName : completion.guestName;
      el('completionOutcome').textContent = completion.outcome === 'tie' ? (zh ? '平局' : 'Tie') : completion.outcome === 'aborted' ? (zh ? '比赛中止' : 'Game aborted') : `${winner}${zh ? '获胜' : ' wins'}`;
      el('completionScore').hidden = !completion.showsScore;
      el('completionScore').textContent = completion.showsScore ? `${completion.homePeriodWins ?? completion.homeScore} – ${completion.guestPeriodWins ?? completion.guestScore}` : '';
      el('completionTeams').textContent = `${completion.homeName} · ${completion.guestName}`;
    }

    function applyState(state) {
      if (!state || !state.teams || !state.clocks) return;

      const home = state.teams.home || {};
      const guest = state.teams.guest || {};
      const rules = state.rules || {};
      const game = state.game || {};
      const clocks = state.clocks || {};
      const display = state.display || {};
      const runtime = state.runtime || {};
      const mode = displayMode(display);
      const isBlackoutMode = mode === 'blackScreen' || mode === 'backgroundOnly';
      document.body.classList.toggle('blackout', isBlackoutMode);
      applyPauseTimer(clocks, state.teams, display, isBlackoutMode || !!game.completion);
      applyCompletion(game.completion, isBlackoutMode);
      if (isBlackoutMode) { transitionScene(null); observeBroadcastEvents(state); return; }

      const supportedMode = mode === 'eventLogo' || mode === 'teamView' || mode === 'playerView' ? mode : 'scoreboard';
      setActiveView(supportedMode);
      el('teamEventName').textContent = game.eventName || '';
      el('playerEventName').textContent = game.eventName || '';
      observeBroadcastEvents(state);
      if (supportedMode === 'eventLogo') {
        applyEventBug(game, rules, display);
        return;
      }
      if (supportedMode === 'teamView') {
        applyTeamBug(home, guest, display, runtime);
        return;
      }
      if (supportedMode === 'playerView') {
        applyPlayerBug(state, home, guest, display, runtime);
        return;
      }

      applyDisplayDirection(display, runtime);

      el('homeName').textContent = text(home.name, t('home'));
      el('guestName').textContent = text(guest.name, t('guest'));
      applyLogo('homeLogo', display.showsTeamLogos === false ? null : home.logo);
      applyLogo('guestLogo', display.showsTeamLogos === false ? null : guest.logo);
      document.querySelectorAll('.score-wrap').forEach(node => node.classList.toggle('hidden', rules.supportsScore === false));
      el('homeScore').textContent = text(home.score, 0);
      el('guestScore').textContent = text(guest.score, 0);
      applyPauseCounters(home, guest, rules);

      const periodShort = localizedPeriodShort(rules.periodShortTitle);
      el('period').textContent = rules.supportsPeriod ? `${periodShort} ${text(game.period, 1)}` : text(rules.sport, t('live'));

      if (rules.usesChessClocks) {
        el('clock').textContent = `${text(clocks.formattedHomeChessClock, '00:00')}/${text(clocks.formattedGuestChessClock, '00:00')}`;
      } else {
        el('clock').textContent = clocks.showsGameClock ? text(clocks.formattedGameClock, '00:00') : t('live');
      }
      el('clock').classList.toggle('timer-alert', clocks.gameClockSeconds === 0 && clocks.showsGameClock !== false);
      if (state.debate?.segmentTitle) el('period').textContent = state.debate.segmentTitle;
      fitClockToOneLine();

      const injuryMinutes = Number(clocks.activeInjuryTimeMinutes || 0);
      el('extra').classList.toggle('injury', injuryMinutes > 0);
      el('extra').textContent = injuryMinutes > 0
        ? `+${injuryMinutes} min`
        : (rules.supportsShotClock ? `${t('shotClockShort')} ${text(clocks.formattedShotClock, '0.0')}` : text(rules.title, t('live')));
    }

    let currentScene = null, desiredScene = null, sceneTimer;
    let scoreSnapshot = null;
    const playerSnapshots = new Map(), scoreTimers = new Map();
    let foulQueue = [], foulTimer, foulCloseTimer, poweredEntryTimer, poweredHoldTimer, poweredExitTimer;

    function clearBroadcastEffects() {
      for (const timer of scoreTimers.values()) clearTimeout(timer);
      scoreTimers.clear(); document.querySelectorAll('.score-change').forEach(node => node.remove());
      foulQueue = []; clearTimeout(foulTimer); clearTimeout(foulCloseTimer); el('foulToast').hidden = true;
      clearTimeout(poweredEntryTimer); clearTimeout(poweredHoldTimer); clearTimeout(poweredExitTimer); el('scorePowered').hidden = true;
    }

    function transitionScene(mode) {
      if (desiredScene === mode) return;
      desiredScene = mode; clearTimeout(sceneTimer); clearBroadcastEffects();
      const ids = {scoreboard:'scorebug', teamView:'teamBug', playerView:'playerBug', eventLogo:'eventBug'};
      const panels = Object.values(ids).map(el);
      const outgoing = panels.find(panel => !panel.classList.contains('hidden'));
      const open = () => {
        panels.forEach(panel => { panel.classList.add('hidden'); panel.dataset.motion = 'hidden'; });
        currentScene = mode;
        const incoming = ids[mode] && el(ids[mode]);
        el('scenePowered').hidden = !incoming || mode === 'scoreboard';
        if (!incoming) return;
        incoming.classList.remove('hidden'); incoming.dataset.motion = 'entering';
        if (mode === 'scoreboard') {
          const logo = el('scorePowered'); logo.hidden = false; logo.dataset.motion = 'entering';
          poweredEntryTimer = setTimeout(() => {
            logo.dataset.motion = 'visible';
            poweredHoldTimer = setTimeout(() => { logo.dataset.motion = 'exiting'; poweredExitTimer = setTimeout(() => { logo.hidden = true; }, 400); }, 5000);
          }, 450);
        }
      };
      el('scenePowered').hidden = true;
      if (outgoing) { outgoing.dataset.motion = 'exiting'; sceneTimer = setTimeout(open, 400); }
      else open();
    }

    function canAnnounce() { return desiredScene === 'scoreboard' && currentScene === 'scoreboard' && !document.body.classList.contains('blackout') && el('completionOverlay').hidden; }

    function observeBroadcastEvents(state) {
      const {teams = {}, players = {}, display = {}} = state;
      for (const side of ['home', 'guest']) {
        const team = teams[side] || {}, next = Number(team.score), previous = scoreSnapshot?.[side];
        const wrapper = el(`${side}Score`).parentElement;
        if (Number.isFinite(previous) && Number.isFinite(next) && next !== previous) {
          clearTimeout(scoreTimers.get(side)); wrapper.querySelector('.score-change')?.remove();
          if (next > previous && canAnnounce() && state.rules?.supportsScore !== false) {
            const effect = document.createElement('div'); effect.className = 'score-change';
            for (const [name, value] of [['score-old',previous],['score-delta',`+${next-previous}`],['score-new',next]]) { const span = document.createElement('span'); span.className = name; span.textContent = value; effect.appendChild(span); }
            wrapper.appendChild(effect); scoreTimers.set(side, setTimeout(() => { effect.remove(); scoreTimers.delete(side); }, 1100));
          }
        }
        const roster = players[`${side}Roster`]?.players;
        const currentPlayers = roster?.length ? roster : players[`${side}Displayed`] || [];
        const present = new Set();
        for (const player of currentPlayers) {
          if (!player.id) continue;
          const key = `${side}:${player.id}`; present.add(key);
          const before = playerSnapshots.get(key), after = {fouls: Number(player.foulCount || 0), card: player.cardStatus || 'none'};
          playerSnapshots.set(key, after);
          if (!before || !canAnnounce() || !String(player.name || '').trim() || !String(player.number ?? '').trim()) continue;
          const details = [], zh = document.documentElement.lang.startsWith('zh');
          if (after.fouls > before.fouls) details.push(zh ? `犯规 +${after.fouls-before.fouls} · 共 ${after.fouls} 次` : `Foul +${after.fouls-before.fouls} · ${after.fouls} total`);
          const added = ({none:0,yellow:1,red:2}[after.card] || 0) > ({none:0,yellow:1,red:2}[before.card] || 0);
          if (added) details.push(after.card === 'red' ? (zh ? '红牌' : 'Red card') : (zh ? '黄牌' : 'Yellow card'));
          if (details.length) foulQueue.push({text:`${team.name || t(side)} · #${player.number} ${player.name} — ${details.join(' · ')}`, kind: added ? after.card : 'foul'});
        }
        for (const key of playerSnapshots.keys()) if (key.startsWith(`${side}:`) && !present.has(key)) playerSnapshots.delete(key);
      }
      scoreSnapshot = Object.fromEntries(['home','guest'].map(side => [side, Number(teams[side]?.score)]));
      showNextFoul();
    }

    function showNextFoul() {
      const toast = el('foulToast');
      if (!toast.hidden || !foulQueue.length || !canAnnounce()) return;
      const event = foulQueue.shift(); toast.textContent = event.text; toast.dataset.kind = event.kind; toast.dataset.motion = 'entering'; toast.hidden = false;
      foulTimer = setTimeout(() => { toast.dataset.motion = 'exiting'; foulCloseTimer = setTimeout(() => { toast.hidden = true; showNextFoul(); }, 300); }, 3200);
    }

    function handleV2Message(message) {
      if (!message || message.schemaVersion !== 2) return;
      if (message.type === 'scoreboard.v2.manifest') return;
      if (message.type !== 'scoreboard.v2.resource') return;

      const envelope = message.payload || {};
      const resource = message.resource || envelope.resource;
      if (!resource) return;

      v2State[resource] = envelope.data;
      if (envelope.generatedAt) v2State.generatedAt = envelope.generatedAt;
      if (envelope.generatedAtUnixTime !== undefined) v2State.generatedAtUnixTime = envelope.generatedAtUnixTime;
      applyState(v2State);
    }

    function connect() {
      clearTimeout(reconnectTimer);
      socket = new WebSocket(wsURL);
      socket.onopen = () => {
        setConnected(true);
        Object.keys(v2State).forEach(key => delete v2State[key]);
        socket.send(JSON.stringify({ type: 'subscribe', apiVersion: 'v2' }));
      };
      socket.onmessage = event => {
        try {
          handleV2Message(JSON.parse(event.data));
        } catch {
          setConnected(false);
        }
      };
      socket.onclose = () => {
        setConnected(false);
        reconnectTimer = setTimeout(connect, 1200);
      };
      socket.onerror = () => {
        setConnected(false);
      };
    }

    localizeStaticText();
    connect();
    window.addEventListener('resize', fitClockToOneLine);
  </script>
</body>
</html>
